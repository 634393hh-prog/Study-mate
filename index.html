<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2563eb"><link rel="manifest" href="manifest.webmanifest"><title>StudyMate</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#172033;font-family:Arial,Tahoma,sans-serif}header{background:#1d4ed8;color:white;padding:24px;border-radius:0 0 22px 22px}main{max-width:720px;margin:18px auto;padding:0 14px}.panel,.lesson{background:white;border:1px solid #e2e8f0;border-radius:16px;padding:16px;margin:14px 0}h1{margin:0 0 6px}h2{font-size:19px}label{display:block;font-weight:bold;margin:12px 0 6px}input,textarea{width:100%;padding:12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}textarea{min-height:70px}button{background:#2563eb;color:white;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:bold}.danger{background:#fee2e2;color:#991b1b}.muted{font-size:13px;color:#64748b}.files{padding-right:22px}.files li{margin:8px 0;overflow-wrap:anywhere}.video{position:relative;padding-top:56.25%;margin-top:12px}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0;border-radius:12px}.empty{text-align:center;color:#64748b;padding:24px}#msg{display:none;background:#dcfce7;color:#166534;padding:10px;border-radius:10px}
</style></head><body><header><h1>StudyMate 📚</h1><div>مساحتك لتنظيم الدروس والملفات والفيديوهات</div></header><main><div id="msg"></div><section class="panel"><h2>إضافة درس جديد</h2><form id="form"><label>عنوان الدرس *</label><input id="title" required placeholder="مثلاً: Introduction à l'algèbre"><label>المادة</label><input id="subject" placeholder="Algèbre"><label>ملاحظات</label><textarea id="desc"></textarea><label>ملفات الدرس — يمكنك اختيار عدة ملفات</label><input id="files" type="file" multiple><div class="muted">يمكن إرفاق PDF وWord والصور وغيرها. تحفظ الملفات على هذا الجهاز.</div><label>رابط فيديو YouTube (اختياري)</label><input id="youtube" type="url" placeholder="https://www.youtube.com/watch?v=..."><div class="muted">الفيديو يعمل عبر الإنترنت؛ لا يتم تنزيل فيديو YouTube.</div><p><button>حفظ الدرس</button></p></form></section><h2>دروسي</h2><div id="lessons"></div></main><script>
const DB='StudyMateV2',STORE='files',KEY='studymate_v2_lessons';let lessons=JSON.parse(localStorage.getItem(KEY)||'[]');const $=x=>document.getElementById(x);
function db(){return new Promise((ok,no)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{keyPath:'id',autoIncrement:true});r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)})}
async function addFile(lessonId,file){let d=await db();return new Promise((ok,no)=>{let t=d.transaction(STORE,'readwrite');t.objectStore(STORE).add({lessonId,name:file.name,size:file.size,blob:file});t.oncomplete=ok;t.onerror=()=>no(t.error)})}
async function getFiles(id){let d=await db();return new Promise((ok,no)=>{let r=d.transaction(STORE).objectStore(STORE).getAll();r.onsuccess=()=>ok(r.result.filter(x=>x.lessonId===id));r.onerror=()=>no(r.error)})}
function yt(url){try{let u=new URL(url);if(u.hostname.includes('youtu.be'))return u.pathname.slice(1);if(u.hostname.includes('youtube.com'))return u.searchParams.get('v')||u.pathname.split('/')[2]}catch(e){}return null}
function notice(s){$('msg').textContent=s;$('msg').style.display='block';setTimeout(()=>$('msg').style.display='none',3500)}
async function render(){let root=$('lessons');root.innerHTML='';if(!lessons.length){root.innerHTML='<div class="empty">لا توجد دروس بعد.</div>';return}for(let l of [...lessons].reverse()){let c=document.createElement('article');c.className='lesson';let h=document.createElement('h3');h.textContent=l.title;c.append(h);if(l.subject){let p=document.createElement('div');p.className='muted';p.textContent=l.subject;c.append(p)}if(l.desc){let p=document.createElement('p');p.textContent=l.desc;c.append(p)}let fs=await getFiles(l.id);if(fs.length){let b=document.createElement('b');b.textContent='الملفات المرفقة ('+fs.length+')';c.append(b);let ul=document.createElement('ul');ul.className='files';fs.forEach(f=>{let li=document.createElement('li'),a=document.createElement('a');a.href=URL.createObjectURL(f.blob);a.download=f.name;a.textContent=f.name+' — '+Math.round(f.size/1024)+' KB';li.append(a);ul.append(li)});c.append(ul)}if(l.youtube&&yt(l.youtube)){let v=document.createElement('div');v.className='video';let i=document.createElement('iframe');i.src='https://www.youtube-nocookie.com/embed/'+encodeURIComponent(yt(l.youtube));i.allow='accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';i.allowFullscreen=true;v.append(i);c.append(v)}let b=document.createElement('button');b.className='danger';b.textContent='حذف الدرس';b.onclick=async()=>{if(confirm('حذف الدرس؟')){lessons=lessons.filter(x=>x.id!==l.id);localStorage.setItem(KEY,JSON.stringify(lessons));let d=await db(),t=d.transaction(STORE,'readwrite'),s=t.objectStore(STORE),r=s.getAll();r.onsuccess=()=>r.result.filter(x=>x.lessonId===l.id).forEach(x=>s.delete(x.id));render()}};c.append(b);root.append(c)}}
$('form').onsubmit=async e=>{e.preventDefault();let url=$('youtube').value.trim();if(url&&!yt(url)){notice('رابط YouTube غير صالح.');return}let l={id:String(Date.now()),title:$('title').value.trim(),subject:$('subject').value.trim(),desc:$('desc').value.trim(),youtube:url};lessons.push(l);localStorage.setItem(KEY,JSON.stringify(lessons));try{for(let f of $('files').files)await addFile(l.id,f);e.target.reset();await render();notice('تم حفظ الدرس وملفاته.')}catch(err){notice('تم حفظ الدرس لكن تعذر حفظ أحد الملفات.')}};render();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
